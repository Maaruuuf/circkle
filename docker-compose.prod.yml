# Full production-like stack on ONE server (a VPS):
#   nginx (load balancer + cache) -> 2 backend instances + frontend -> postgres + redis
#
#   cp .env.prod.example .env.prod      # fill in the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# TLS: terminate HTTPS in front of this (Cloudflare proxy, Caddy, or a cloud load balancer),
# or add certificates to nginx. See docs/DEPLOYMENT.md.
x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env.prod
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+asyncpg://circkle:${POSTGRES_PASSWORD}@db:5432/circkle
    REDIS_URL: redis://redis:6379/0
    TRUSTED_PROXY: "true"
    LOG_JSON: "true"
    COOKIE_SECURE: "true"
    MEDIA_ROOT: /app/media_files
  volumes:
    - media_data:/app/media_files
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_started

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: circkle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: circkle
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circkle -d circkle"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  # One-shot job: apply database migrations, then exit. Backends wait for it.
  migrate:
    build: ./backend
    env_file: .env.prod
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://circkle:${POSTGRES_PASSWORD}@db:5432/circkle
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend1:
    <<: *backend
  backend2:
    <<: *backend

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend1:8000
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend1:8000

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on: [backend1, backend2, frontend]

volumes:
  pgdata:
  media_data:
  nginx_cache:
