worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Load balancing: requests go to whichever backend has the fewest active connections.
  upstream api {
    least_conn;
    server backend1:8000 max_fails=3 fail_timeout=10s;
    server backend2:8000 max_fails=3 fail_timeout=10s;
  }
  upstream web {
    server frontend:3000;
  }

  # Cache for uploaded images (they never change: file names are random and unique).
  proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m max_size=1g inactive=7d use_temp_path=off;

  # Coarse per-IP limit at the edge, in addition to the app's own limits.
  limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;

  server {
    listen 80;
    client_max_body_size 6m;   # a little above MAX_UPLOAD_MB

    proxy_set_header Host              $host;
    # OVERWRITE (never append) so a client cannot spoof its IP: the app trusts X-Real-IP.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location /api/ {
      limit_req zone=perip burst=60 nodelay;
      proxy_pass http://api;
      proxy_next_upstream error timeout http_502 http_503;
    }

    location /media/ {
      proxy_pass http://api;
      proxy_cache media;
      proxy_cache_valid 200 7d;
      proxy_cache_valid 404 1m;
      add_header X-Cache-Status $upstream_cache_status;
    }

    location = /health {
      proxy_pass http://api;
      access_log off;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
